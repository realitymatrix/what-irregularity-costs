[package]
name = "tsdf-rust-cuda"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Standalone, NOT a member of the top-level workspace. cuda-oxide needs the
# pinned nightly in rust-toolchain.toml plus its own codegen backend; the rest
# of the project builds on stable.
[workspace]

[lib]
name = "tsdf_rust_cuda"
# staticlib so the C++ test harness can link A4 directly. cuda-oxide's model is
# single-source (device artifact embedded in the host object, typed launch
# methods generated), so there is no standalone cubin to hand to a separate
# launcher; exposing a C ABI is the way another arm's driver reaches these
# kernels.
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "tsdf-rust-cuda"
path = "src/main.rs"

[dependencies]
cuda-device = { path = "/home/petr/.local/opt/cuda-oxide/crates/cuda-device" }
cuda-host = { path = "/home/petr/.local/opt/cuda-oxide/crates/cuda-host" }
cuda-core = { path = "/home/petr/.local/opt/cuda-oxide/crates/cuda-core" }
